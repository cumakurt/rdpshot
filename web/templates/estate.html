{{ define "estate" }}
<!DOCTYPE html>
<html lang="en">
  <head>
    {{ template "head" . }}
  </head>
  <body class="antialiased">
    {{ template "nav" . }}
    <main class="page-main">
      <section class="page-head">
        <div>
          <p class="page-eyebrow">Attack surface</p>
          <h1 class="page-title mt-1">Estate map</h1>
          <p class="page-subtitle">Host risk graph from hardening scores and findings.</p>
        </div>
      </section>

      <section class="card mb-6">
        <div class="card-body">
          <form method="get" action="/estate" class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div class="field">
              <label class="label" for="estate-engagement">Engagement filter</label>
              <input id="estate-engagement" name="engagement" type="text" class="input" value="{{ .Engagement }}" placeholder="optional">
            </div>
            <div class="field">
              <label class="label" for="estate-scan">Or single scan</label>
              <select id="estate-scan" class="input" data-estate-scan>
                <option value="">All matching scans</option>
                {{ range .Scans }}
                <option value="{{ .ID }}">{{ .Name }} ({{ .ID }})</option>
                {{ end }}
              </select>
            </div>
            <div class="field flex items-end">
              <button type="submit" class="btn btn-primary btn-block">Apply</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">Risk map</h2>
          <span class="badge badge-slate" data-estate-count>0 nodes</span>
        </div>
        <div class="card-body">
          <svg id="estate-graph" viewBox="0 0 960 520" class="w-full h-auto rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40" role="img" aria-label="Estate risk graph"></svg>
          <p class="card-hint mt-3" data-estate-status>Loading estate graph…</p>
          <ul class="mt-4 space-y-2 text-sm" data-estate-legend></ul>
        </div>
      </section>
    </main>
    {{ template "footer" . }}
    <script src="/static/js/app.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var engagement = params.get('engagement') || '';
        var scanSelect = document.querySelector('[data-estate-scan]');
        var statusEl = document.querySelector('[data-estate-status]');
        var countEl = document.querySelector('[data-estate-count]');
        var legendEl = document.querySelector('[data-estate-legend]');
        var svg = document.getElementById('estate-graph');

        function severityColor(sev) {
          switch ((sev || '').toLowerCase()) {
            case 'critical': return '#e11d48';
            case 'high': return '#f97316';
            case 'medium': return '#eab308';
            case 'low': return '#38bdf8';
            default: return '#64748b';
          }
        }

        function render(graph) {
          while (svg.firstChild) svg.removeChild(svg.firstChild);
          var nodes = graph.nodes || [];
          countEl.textContent = nodes.length + ' nodes';
          if (!nodes.length) {
            statusEl.textContent = 'No hosts in this estate yet.';
            return;
          }
          statusEl.textContent = (graph.engagement ? 'Engagement: ' + graph.engagement + ' · ' : '') +
            nodes.length + ' hosts · ' + ((graph.edges || []).length) + ' finding edges';

          var cols = Math.ceil(Math.sqrt(nodes.length));
          nodes.forEach(function (n, i) {
            var col = i % cols;
            var row = Math.floor(i / cols);
            var x = 80 + col * Math.min(180, 860 / Math.max(cols, 1));
            var y = 60 + row * 90;
            var r = 10 + Math.min(24, (n.risk_score || 0) * 2);
            var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', n.open ? severityColor(n.max_severity || 'info') : '#94a3b8');
            circle.setAttribute('opacity', '0.9');
            circle.setAttribute('title', n.id);
            svg.appendChild(circle);
            var label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', x);
            label.setAttribute('y', y + r + 14);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('font-size', '10');
            label.setAttribute('fill', 'currentColor');
            label.textContent = n.address + ' · ' + (n.grade || '?') + ' · ' + (n.hardening_score || 0);
            svg.appendChild(label);
          });

          legendEl.innerHTML = '';
          nodes.slice(0, 20).sort(function (a, b) { return (b.risk_score || 0) - (a.risk_score || 0); })
            .forEach(function (n) {
              var li = document.createElement('li');
              li.className = 'flex justify-between gap-4 font-mono text-xs';
              li.innerHTML = '<span>' + n.id + '</span><span>risk ' + (n.risk_score || 0) +
                ' · harden ' + (n.hardening_score || 0) + ' (' + (n.grade || '-') + ')</span>';
              legendEl.appendChild(li);
            });
        }

        function load() {
          var q = new URLSearchParams();
          if (engagement) q.set('engagement', engagement);
          var scanId = scanSelect && scanSelect.value;
          if (scanId) q.set('scan_id', scanId);
          fetch('/api/v1/estate?' + q.toString())
            .then(function (r) { return r.json(); })
            .then(render)
            .catch(function (err) {
              statusEl.textContent = 'Failed to load estate: ' + err;
            });
        }

        if (scanSelect) scanSelect.addEventListener('change', load);
        load();
      })();
    </script>
  </body>
</html>
{{ end }}

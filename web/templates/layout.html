{{ define "head" }}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ .Title }} · RDPShot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="/static/css/app.css">
{{ end }}

{{ define "nav" }}
  <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
      <a href="/" class="flex items-center gap-2">
        <svg class="h-6 w-6 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"></rect>
          <path d="M8 20h8M12 16v4"></path>
          <path d="M7 8h6M7 11h4"></path>
        </svg>
        <span class="text-lg font-bold tracking-tight text-white">RDP<span class="text-indigo-500">Shot</span></span>
      </a>
      <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Primary">
        <a href="/" class="nav-link{{ if eq .ActiveNav "dashboard" }} is-active{{ end }}">Dashboard</a>
        <a href="/scans" class="nav-link{{ if eq .ActiveNav "scans" }} is-active{{ end }}">Scans</a>
        <a href="/gallery" class="nav-link{{ if eq .ActiveNav "gallery" }} is-active{{ end }}">Gallery</a>
        <a href="/reports" class="nav-link{{ if eq .ActiveNav "reports" }} is-active{{ end }}">Reports</a>
      </nav>
    </div>
  </header>
{{ end }}

{{ define "footer" }}
  <footer class="mt-12 border-t border-slate-800 bg-slate-950">
    <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-2 px-4 py-6 text-xs text-slate-500 sm:flex-row sm:items-center sm:px-6 lg:px-8">
      <p><span class="font-semibold text-slate-400">RDPShot</span> · RDP Security Audit Platform. Authorized testing only.</p>
      <p class="font-mono">Cyber-Command Center</p>
    </div>
  </footer>
{{ end }}
